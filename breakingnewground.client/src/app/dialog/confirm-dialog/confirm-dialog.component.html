<h2 mat-dialog-title>Подтверждение удаления</h2>
<mat-dialog-content>
  Вы уверены, что хотите удалить эту запись?
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-raised-button color="primary" [mat-dialog-close]="true">Да</button>
  <button mat-button mat-dialog-close>Нет</button>
</mat-dialog-actions>
