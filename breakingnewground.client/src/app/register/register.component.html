<form (ngSubmit)="submit()" class="auth-form">
  <h2>Регистрация</h2>

  <mat-form-field appearance="outline">
    <mat-label>Имя пользователя</mat-label>
    <input matInput
      type="text"
      [(ngModel)]="userName"
      name="userName"
      required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Пароль</mat-label>
      <input matInput
        type="password"
        [(ngModel)]="password"
        name="password"
        required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Подтверждение пароля</mat-label>
        <input matInput
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required>
        </mat-form-field>

        <button mat-raised-button
          color="primary"
          type="submit">
          Зарегистрироваться
        </button>

        @if (error) {
          <div class="error">{{ error }}</div>
        }
      </form>
