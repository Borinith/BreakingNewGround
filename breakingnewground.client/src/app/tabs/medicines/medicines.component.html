<mat-drawer-container class="example-container">
  <mat-drawer #drawer
              [mode]="(isMobile$ | async) ? 'over' : 'side'"
              [opened]="!(isMobile$ | async)">
    <mat-nav-list>
      <a mat-list-item routerLink="/tabs/medicines/medicines" routerLinkActive="active-link" (click)="onNavClick(drawer)">Лекарства</a>
      <a mat-list-item routerLink="/tabs/medicines/medicinebodytypes" routerLinkActive="active-link" (click)="onNavClick(drawer)">Категории</a>
      <a mat-list-item routerLink="/tabs/medicines/medicinetypes" routerLinkActive="active-link" (click)="onNavClick(drawer)">Типы лекарств</a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    @if (isMobile$ | async) {
      <button mat-icon-button class="drawer-toggle" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
