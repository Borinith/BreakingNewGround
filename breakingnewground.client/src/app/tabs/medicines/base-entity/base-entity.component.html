<h2 id="tabLabel">{{componentName}}</h2>

<div class="content-wrapper" [formGroup]="filterForm">
  <div class="content-container" [class.loading]="isLoading">
    <div class="add-form-common">
      <mat-form-field appearance="outline">
        <mat-label>Название</mat-label>
        <input matInput
               [(ngModel)]="newItem.name"
               [ngModelOptions]="{ standalone: true }" />
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="addItem()">Добавить</button>
    </div>
    
    <table mat-table [dataSource]="items" matSort class="mat-elevation-z2">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="Id">
          ID
          <div class="header-filter">
            <mat-form-field style="margin-bottom: -1.25em" appearance="outline" floatLabel="auto">
              <input matInput placeholder="Фильтр" formControlName="id" />
            </mat-form-field>
          </div>
        </th>
        <td mat-cell *matCellDef="let item"> {{item.id}} </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="Name">
          Название
          <div class="header-filter">
            <mat-form-field style="margin-bottom: -1.25em" appearance="outline" floatLabel="auto">
              <input matInput placeholder="Фильтр" formControlName="name" />
            </mat-form-field>
          </div>
        </th>
        <td mat-cell *matCellDef="let item">
          <mat-form-field style="margin-bottom: -1.25em" appearance="outline" class="inline-field">
            <input matInput
                   [(ngModel)]="item.name"
                   name="name{{item.id}}"
                   [ngModelOptions]="{ standalone: true }"
                   (blur)="updateItem(item)"
                   placeholder="Название">
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item" class="delete-cell">
          <button mat-icon-button color="warn" (click)="deleteItem(item.id)">
            <mat-icon>close</mat-icon>
          </button>
        </td>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns"
               [class.updated-row]="row.id === updatedId"
               [class.error-row]="row.id === errorId">
      </mat-row>
    </table>

    <mat-paginator [length]="total" [pageSize]="pageSize" [hidePageSize]="true"></mat-paginator>
  </div>

  <div *ngIf="isLoading" class="loading-overlay">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
</div>
