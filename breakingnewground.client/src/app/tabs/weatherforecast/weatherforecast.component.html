<h1 id="tableLabel">Weather forecast</h1>

@if (!forecasts) {
<p>
  <em>Loading...</em>
</p>
}

@if (forecasts) {
<table>
  <thead>
  <tr>
    <th>Date</th>
    <th>Temp. (C)</th>
    <th>Summary</th>
  </tr>
  </thead>
  <tbody>
  @for (forecast of forecasts; track forecast) {
  <tr>
    <td>{{ forecast.date }}</td>
    <td>{{ forecast.temperatureC }}</td>
    <td>{{ forecast.summary }}</td>
  </tr>
  }
  </tbody>
</table>
}
