<div class="horizontalTabs">
  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    <a *ngFor="let link of navLinks" mat-tab-link
       #rla="routerLinkActive"
       [active]="rla.isActive"
       [routerLink]="link.path"
       routerLinkActive>
      {{ link.label }}
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
