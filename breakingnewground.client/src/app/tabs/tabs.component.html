<div class="horizontalTabs">
  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (link of navLinks; track link) {
      <a mat-tab-link
        #rla="routerLinkActive"
        [active]="rla.isActive"
        [routerLink]="link.path"
        routerLinkActive>
        {{ link.label }}
      </a>
    }
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
